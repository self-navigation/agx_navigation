    print_diagnostics: true
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    publish_tf: true

    predict_to_current_time: true
    sensor_timeout: 0.2

    # remapped in launch file
    odom0: odom
    # prettier-ignore
    odom0_config: [true,  true,  false, # x, y, z position
                   false, false, false, # r, p, y
                   true,  true,  false, # x, y, z vel
                   false, false, true,  # r, p, y rate
                   false, false, false] # x, y, z accel
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 20

    # remapped in launch file
