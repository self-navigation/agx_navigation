schema_version: 1
profile: baseline_profile.yaml
map:
  grid:
    shape: [201, 301]
    resolution: 0.05
    origin: [0.0, 0.0, 0.0]
    rectangles:
      - [0, 0, 301, 1, 100]
      - [0, 200, 301, 201, 100]
      - [0, 0, 1, 201, 100]
      - [300, 0, 301, 201, 100]
      - [100, 60, 200, 140, 100]
      - [140, 90, 160, 110, 0]
      - [20, 30, 70, 80, 100]
      - [35, 45, 45, 55, 0]
      - [230, 145, 280, 190, 100]
      - [245, 160, 255, 170, 0]
cases:
  # Closing an unreachable cavity changes interior distances beyond the edit,
  # while the outer travel-time field stays the same.
  - id: cavity_closure
    start: [4.025, 8.025, 0.0, 0.0, 0.0]
    goal: [2.025, 8.025, 0.0]
    updates:
      - id: closed
        rectangles: [[140, 90, 160, 110, 100]]
      - id: repeated
      - id: reopened
        rectangles: [[140, 90, 160, 110, 0]]
  # Distant cavities exercise separate update regions in one request.
  - id: separated_cavities
    start: [4.025, 8.025, 0.0, 0.0, 0.0]
    goal: [2.025, 8.025, 0.0]
    updates:
      - id: closed
        rectangles:
          - [35, 45, 45, 55, 100]
          - [245, 160, 255, 170, 100]
      - id: repeated
      - id: reopened
        rectangles:
          - [35, 45, 45, 55, 0]
          - [245, 160, 255, 170, 0]
