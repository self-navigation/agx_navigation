schema_version: 1
profile: baseline_profile.yaml
session: execution-smoke
map:
  grid:
    shape: [61, 101]
    resolution: 0.05
    origin: [0.0, 0.0, 0.0]
    rectangles:
      - [0, 0, 101, 1, 100]
      - [0, 60, 101, 61, 100]
      - [0, 0, 1, 61, 100]
      - [100, 0, 101, 61, 100]
start: [1.025, 1.525, 0.0, 0.0, 0.0]
goal: [3.025, 1.525, 0.0]
# The object is away from the route. R1 deliberately stops on any map reveal.
objects:
  - id: leaf
    rectangles: [[45, 1, 47, 10, 100]]
sensor:
  max_range: 0.05
scheduled_reveals:
  - time: 1.0
    ids: [leaf]
execution:
  mode: nominal
  sample_period: 0.1
  collision_step: 0.02
  goal_xy: 0.05
  goal_heading: 0.2
  goal_wheel_speed: 0.5
  max_execution_s: 120.0
  max_replans: 8
brake:
  # Declared model assumption, not a measured physical stopping capability.
  deceleration: 17.6
  delay_s: 0.05
  max_step_s: 0.02
  wheel_speed_limit: 20.0
footprint:
  half_length: 0.315
  half_width: 0.2925
  margin: 0.0
